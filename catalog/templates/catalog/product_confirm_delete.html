{% extends 'crm/base.html' %}
{% block title %}Ištrinti prekę/paslaugą | Bussy'Note{% endblock %}
{% block content %}
<div style="max-width:560px;margin:0 auto">
    <div class="bn-card">
        <h2 class="bn-card-title" style="font-size:20px">Ištrinti „{{ product.name }}“?</h2>
        <p style="color:var(--mut)">Ar tikrai norite ištrinti šį įrašą iš katalogo?</p>
        <form method="post" style="display:flex;gap:10px">
            {% csrf_token %}
            <button type="submit" class="bn-btn bn-btn-danger">Taip, ištrinti</button>
            <a class="bn-btn bn-btn-ghost" href="{% url 'product-list' %}">Atšaukti</a>
        </form>
    </div>
</div>
{% endblock %}
