<div id="task-{{ task.pk }}" class="bn-task-row">
    <input type="checkbox" style="width:20px;height:20px;accent-color:var(--acc);flex:none"
           hx-post="{% url 'task-toggle' task.pk %}"
           hx-target="#task-{{ task.pk }}"
           hx-swap="outerHTML"
           hx-trigger="change"
           {% if task.completed %}checked{% endif %}>
    <div style="flex:1;{% if task.completed %}text-decoration:line-through;color:var(--mut){% endif %}">{{ task.title }}</div>
    <small style="color:var(--mut)">{{ task.created_at|date:"m.d" }}</small>
</div>
