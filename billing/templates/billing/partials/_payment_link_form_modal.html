<div class="bn-modal-overlay" onclick="if(event.target===this){document.getElementById('modal').innerHTML=''}">
    <div class="bn-modal">
        <div class="bn-modal-head">
            <h2 class="bn-modal-title">Sukurti mokėjimo nuorodą</h2>
            <button type="button" class="bn-close-btn" onclick="document.getElementById('modal').innerHTML=''" aria-label="Uždaryti">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
            </button>
        </div>
        {% if error %}
            <div class="bn-error-slot" style="margin-bottom:14px">Nepavyko sukurti mokėjimo nuorodos: {{ error }}</div>
        {% endif %}
        {% if quota_exceeded %}
            <div class="bn-error-slot" style="margin-bottom:14px">
                Pasiektas „{{ plan_name }}“ plano mėnesio mokėjimo nuorodų limitas.
                <a href="{% url 'plan-list' %}">Pereiti į didesnį planą</a>, kad galėtumėte kurti daugiau.
            </div>
        {% endif %}
        <form hx-post="{% url 'payment-link-create' %}" hx-target="#modal" hx-swap="innerHTML" style="display:grid;gap:14px;{% if quota_exceeded %}opacity:0.5;pointer-events:none;{% endif %}">
            <div class="bn-field">
                <label for="description">Aprašymas</label>
                <input id="description" name="description" class="bn-input" placeholder="Pvz.: Landing page kūrimas">
            </div>
            <div class="bn-form-row">
                <div class="bn-field">
                    <label for="amount">Suma</label>
                    <input id="amount" name="amount" type="number" step="0.01" min="0.01" class="bn-input" required>
                </div>
                <div class="bn-field">
                    <label for="currency">Valiuta</label>
                    <input id="currency" name="currency" class="bn-input" value="EUR" maxlength="3">
                </div>
            </div>
            <div class="bn-field">
                <label for="lead">Susieti su lead'u (nebūtina)</label>
                <select id="lead" name="lead" class="bn-select">
                    <option value="">-</option>
                    {% for lead in leads %}
                        <option value="{{ lead.pk }}" {% if selected_lead == lead.pk|stringformat:"s" %}selected{% endif %}>{{ lead.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="bn-field">
                <label for="product">Susieti su preke/paslauga (nebūtina)</label>
                <select id="product" name="product" class="bn-select">
                    <option value="">-</option>
                    {% for product in products %}
                        <option value="{{ product.pk }}">{{ product.name }} ({{ product.price }} {{ product.currency }})</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="bn-btn bn-btn-primary bn-btn-block">Sukurti nuorodą</button>
        </form>
    </div>
</div>
