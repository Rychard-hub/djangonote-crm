<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI asistentas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; color: #0f172a; }
        .topbar { background: #0f172a; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .topbar a { color: white; text-decoration: none; }
        .nav { display: flex; gap: 1rem; flex-wrap: wrap; }
        .container { padding: 2rem; max-width: 720px; margin: 0 auto; }
        .chat { background: white; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); display: flex; flex-direction: column; height: 65vh; }
        .messages { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.9rem; }
        .msg { max-width: 80%; padding: 0.7rem 0.9rem; border-radius: 10px; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: #2563eb; color: white; }
        .msg.assistant { align-self: flex-start; background: #f1f5f9; color: #0f172a; }
        .msg .role { display: block; font-size: 0.75rem; opacity: 0.7; margin-bottom: 0.2rem; }
        .empty-hint { color: #64748b; text-align: center; margin-top: 2rem; }
        .chat-form { display: flex; gap: 0.6rem; padding: 1rem; border-top: 1px solid #e2e8f0; }
        .chat-form input { flex: 1; padding: 0.7rem; border: 1px solid #cbd5e1; border-radius: 8px; }
        .chat-form button { padding: 0.7rem 1.2rem; background: #2563eb; color: white; border: 0; border-radius: 8px; cursor: pointer; }
        .chat-form button:disabled { opacity: 0.5; cursor: default; }
    </style>
    <script defer src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="topbar">
        <h2>AI asistentas</h2>
        <nav class="nav">
            <a href="/dashboard/">Dashboard</a>
            <a href="/leads/">Lead'ai</a>
            <a href="/followups/">Follow-up</a>
            <a href="/pipeline/">Pipeline</a>
            <a href="/catalog/">Katalogas</a>
            <a href="/billing/payment-links/">Mokėjimai</a>
            <a href="/billing/plans/">Planas</a>
            <a href="/ai-content/">AI turinys</a>
            <a href="/assistant/">AI asistentas</a>
            <a href="#">Nustatymai</a>
        </nav>
    </header>

    <main class="container">
        {{ initial_messages|json_script:"initial-messages" }}
        <div class="chat" x-data="chatWidget()" x-init="init()">
            <div class="messages" x-ref="messagesEl">
                <template x-if="messages.length === 0">
                    <p class="empty-hint">Paklauskite apie savo lead'us, follow-up'us ar užduotis -- pvz. „kokie follow-up'ai vėluoja?“</p>
                </template>
                <template x-for="msg in messages" :key="msg.id">
                    <div class="msg" :class="msg.role">
                        <span class="role" x-text="msg.role === 'user' ? 'Jūs' : 'Asistentas'"></span>
                        <span x-text="msg.content"></span>
                    </div>
                </template>
                <div class="msg assistant" x-show="sending"><em>Asistentas rašo...</em></div>
            </div>
            <form class="chat-form" @submit.prevent="send()">
                <input type="text" x-model="draft" placeholder="Klauskite apie savo lead'us..." :disabled="sending" autofocus>
                <button type="submit" :disabled="sending || !draft.trim()">Siųsti</button>
            </form>
        </div>
    </main>

    <script>
        function chatWidget() {
            return {
                messages: [],
                draft: '',
                sending: false,
                nextId: 1,
                init() {
                    this.messages = JSON.parse(document.getElementById('initial-messages').textContent);
                    this.nextId = this.messages.length + 1;
                    this.$nextTick(() => this.scrollToBottom());
                },
                scrollToBottom() {
                    this.$refs.messagesEl.scrollTop = this.$refs.messagesEl.scrollHeight;
                },
                async send() {
                    const text = this.draft.trim();
                    if (!text || this.sending) return;
                    this.messages.push({ id: this.nextId++, role: 'user', content: text });
                    this.draft = '';
                    this.sending = true;
                    this.$nextTick(() => this.scrollToBottom());
                    try {
                        const resp = await fetch("{% url 'assistant-send' %}", {
                            method: 'POST',
                            headers: {
                                'X-CSRFToken': '{{ csrf_token }}',
                                'Content-Type': 'application/x-www-form-urlencoded',
                            },
                            body: 'message=' + encodeURIComponent(text),
                        });
                        if (!resp.ok) throw new Error('request failed');
                        const data = await resp.json();
                        this.messages.push({ id: this.nextId++, role: 'assistant', content: data.reply });
                    } catch (e) {
                        this.messages.push({ id: this.nextId++, role: 'assistant', content: 'Atsiprašau, nepavyko prisijungti. Bandykite dar kartą.' });
                    } finally {
                        this.sending = false;
                        this.$nextTick(() => this.scrollToBottom());
                    }
                },
            };
        }
    </script>
</body>
</html>
