<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisijungimas | Freelancer CRM</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .auth-container {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            position: relative;
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #1e293b;
            font-weight: 700;
        }
        .logo p {
            margin: 0.5rem 0 0 0;
            color: #64748b;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        input::placeholder {
            color: #9ca3af;
        }
        .btn {
            width: 100%;
            padding: 0.875rem;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .auth-links {
            margin-top: 1.5rem;
            text-align: center;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
        }
        .auth-links a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .auth-links a:hover {
            color: #2563eb;
            text-decoration: underline;
        }
        .error-message {
            background: #fef2f2;
            color: #b91c1c;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid #fecaca;
            font-size: 0.9rem;
        }
        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        .remember-me input[type="checkbox"] {
            width: auto;
            margin-right: 0.5rem;
        }
        .remember-me label {
            margin: 0;
            font-weight: 400;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <h1>🏢 Freelancer CRM</h1>
            <p>Valdyk savo lead'us efektyviai</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="email">📧 El. paštas</label>
                <input id="email" name="email" type="email" placeholder="tavo@email.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">🔒 Slaptažodis</label>
                <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Prisiminti mane</label>
            </div>

            <button type="submit" class="btn">Prisijungti</button>
        </form>
        
        <div class="auth-links">
            <p>Pirmą kartą? <a href="/register/">Sukurti paskyrą</a></p>
            <p style="margin-top: 0.5rem;"><a href="/password-reset/">Pamiršai slaptažodį?</a></p>
        </div>
    </div>
</body>
</html>
