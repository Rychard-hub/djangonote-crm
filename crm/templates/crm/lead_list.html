<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadų sąrašas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; color: #0f172a; }
        .topbar { background: #0f172a; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .topbar a { color: white; text-decoration: none; }
        .nav { display: flex; gap: 1rem; flex-wrap: wrap; }
        .container { padding: 2rem; }
        .toolbar { display: flex; justify-content: space-between; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
        .controls { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .controls input, .controls select, .controls button { padding: 0.6rem; border-radius: 8px; border: 1px solid #cbd5e1; }
        .controls button { background: #2563eb; color: white; border: 0; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
        th, td { padding: 0.8rem; border-bottom: 1px solid #e2e8f0; text-align: left; }
        .badge { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 999px; font-size: 0.8rem; }
        .new { background: #dbeafe; color: #1d4ed8; }
        .contacted { background: #fef3c7; color: #b45309; }
        .proposal { background: #dcfce7; color: #166534; }
        .won { background: #dcfce7; color: #166534; }
        .lost { background: #fee2e2; color: #b91c1c; }
        .late { color: #dc2626; font-weight: bold; }
        .overdue-row { background: #fef2f2; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50; }
        .modal-box { background: white; border-radius: 12px; padding: 1.5rem; max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-box form { display: grid; gap: 0.9rem; }
        .modal-box label { font-weight: 600; font-size: 0.95rem; }
        .modal-box input, .modal-box select, .modal-box textarea { padding: 0.7rem; border: 1px solid #cbd5e1; border-radius: 8px; width: 100%; box-sizing: border-box; }
        .modal-box button[type="submit"] { padding: 0.8rem 1rem; background: #2563eb; color: white; border: 0; border-radius: 8px; cursor: pointer; }
        .modal-box .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
        .modal-box .hint { font-size: 0.85rem; color: #64748b; margin-top: 0.2rem; }
    </style>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <div id="modal"></div>
    <header class="topbar">
        <h2>Leadų sąrašas</h2>
        <nav class="nav">
            <a href="/dashboard/">Dashboard</a>
            <a href="/leads/">Lead'ai</a>
            <a href="/followups/">Follow-up</a>
            <a href="/pipeline/">Pipeline</a>
            <a href="#">Nustatymai</a>
        </nav>
    </header>

    <main class="container">
        <div class="toolbar">
            <div>
                <a href="/leads/new/" hx-get="{% url 'lead-create' %}" hx-target="#modal" hx-swap="innerHTML" style="text-decoration:none;"><button type="button">Pridėti leadą</button></a>
                <span id="total-leads-count" style="margin-left: 1rem; color: #64748b;">Viso leadų: {{ total_leads }}</span>
            </div>
            <form class="controls" method="get"
                  hx-get="{% url 'lead-list' %}" hx-target="#lead-table-wrap" hx-push-url="true"
                  hx-trigger="change from:find select, submit">
                <input type="search" name="q" value="{{ query }}" placeholder="Paieška pagal vardą, įmonę, el. paštą"
                       hx-get="{% url 'lead-list' %}" hx-target="#lead-table-wrap" hx-push-url="true"
                       hx-trigger="keyup changed delay:400ms" />
                <select name="status">
                    <option value="">Visi statusai</option>
                    <option value="new" {% if status == 'new' %}selected{% endif %}>Naujas</option>
                    <option value="contacted" {% if status == 'contacted' %}selected{% endif %}>Susisiekta</option>
                    <option value="proposal" {% if status == 'proposal' %}selected{% endif %}>Pasiūlymas</option>
                    <option value="won" {% if status == 'won' %}selected{% endif %}>Laimėtas</option>
                    <option value="lost" {% if status == 'lost' %}selected{% endif %}>Prarastas</option>
                </select>
                <select name="followup">
                    <option value="">Visi follow-up'ai</option>
                    <option value="today" {% if followup_filter == 'today' %}selected{% endif %}>Šiandien</option>
                    <option value="overdue" {% if followup_filter == 'overdue' %}selected{% endif %}>Vėluojantys</option>
                    <option value="upcoming" {% if followup_filter == 'upcoming' %}selected{% endif %}>Būsimi</option>
                </select>
                <select name="sort">
                    <option value="-updated_at" {% if sort_by == '-updated_at' %}selected{% endif %}>Paskutiniai atnaujinti</option>
                    <option value="name" {% if sort_by == 'name' %}selected{% endif %}>Pagal vardą A-Z</option>
                    <option value="-name" {% if sort_by == '-name' %}selected{% endif %}>Pagal vardą Z-A</option>
                    <option value="next_follow_up" {% if sort_by == 'next_follow_up' %}selected{% endif %}>Artimiausi follow-up'ai</option>
                    <option value="-budget" {% if sort_by == '-budget' %}selected{% endif %}>Didžiausias biudžetas</option>
                </select>
                <button type="submit">Filtruoti</button>
            </form>
        </div>

        <div id="lead-table-wrap">
            {% include 'crm/partials/_lead_table.html' %}
        </div>
    </main>
</body>
</html>
