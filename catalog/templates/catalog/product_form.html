<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if mode == 'edit' %}Redaguoti{% else %}Nauja{% endif %} prekė/paslauga</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; color: #0f172a; }
        .container { max-width: 640px; margin: 2rem auto; background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
        form { display: grid; gap: 0.9rem; }
        label { font-weight: 600; font-size: 0.95rem; }
        input, select, textarea { padding: 0.7rem; border: 1px solid #cbd5e1; border-radius: 8px; width: 100%; box-sizing: border-box; }
        button { padding: 0.8rem 1rem; background: #2563eb; color: white; border: 0; border-radius: 8px; cursor: pointer; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="container">
        <h2>{% if mode == 'edit' %}Redaguoti prekę/paslaugą{% else %}Pridėti prekę/paslaugą{% endif %}</h2>
        <form method="post">
            {% csrf_token %}
            <div>
                <label for="name">Pavadinimas</label>
                <input id="name" name="name" value="{{ product.name|default:'' }}" required>
            </div>
            <div class="row">
                <div>
                    <label for="kind">Tipas</label>
                    <select id="kind" name="kind">
                        <option value="product" {% if product.kind == 'product' %}selected{% endif %}>Produktas</option>
                        <option value="service" {% if product.kind == 'service' or not product %}selected{% endif %}>Paslauga</option>
                    </select>
                </div>
                <div>
                    <label for="active">Būsena</label>
                    <select id="active" name="active">
                        <option value="1" {% if product.active or not product %}selected{% endif %}>Aktyvus</option>
                        <option value="" {% if product and not product.active %}selected{% endif %}>Neaktyvus</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div>
                    <label for="price">Kaina</label>
                    <input id="price" name="price" type="number" step="0.01" value="{{ product.price|default:'0' }}">
                </div>
                <div>
                    <label for="currency">Valiuta</label>
                    <input id="currency" name="currency" value="{{ product.currency|default:'EUR' }}" maxlength="3">
                </div>
            </div>
            <div>
                <label for="description">Aprašymas</label>
                <textarea id="description" name="description" rows="3">{{ product.description|default:'' }}</textarea>
            </div>
            <button type="submit">Išsaugoti</button>
        </form>
    </div>
</body>
</html>
