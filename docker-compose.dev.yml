
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dj-crm-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dizainas-77
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dj-crm-db"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=crm_project.settings
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=dj-crm-db
      - DB_USER=postgres
      - DB_PASSWORD=dizainas-77
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A crm_project worker --loglevel=info
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=crm_project.settings
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=dj-crm-db
      - DB_USER=postgres
      - DB_PASSWORD=dizainas-77
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - media_volume:/app/media

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A crm_project beat --loglevel=info
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=crm_project.settings
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=dj-crm-db
      - DB_USER=postgres
      - DB_PASSWORD=dizainas-77
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - media_volume:/app/media

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
