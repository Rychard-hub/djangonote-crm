<div class="bn-comment">
    <div class="bn-comment-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"></path></svg>
    </div>
    <div style="min-width:0">
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px">
            <span style="font-weight:600;font-size:13px">{{ comment.get_kind_display }} · <span style="color:var(--mut);font-weight:500">{{ comment.author }}</span></span>
            <span style="font-size:12px;color:var(--mut)">{{ comment.created_at|date:"Y-m-d H:i" }}</span>
        </div>
        <div style="margin-top:2px">{{ comment.body }}</div>
    </div>
</div>
