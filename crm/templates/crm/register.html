<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija | Freelancer CRM</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .auth-container {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            position: relative;
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #1e293b;
            font-weight: 700;
        }
        .logo p {
            margin: 0.5rem 0 0 0;
            color: #64748b;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        input::placeholder {
            color: #9ca3af;
        }
        .btn {
            width: 100%;
            padding: 0.875rem;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .auth-links {
            margin-top: 1.5rem;
            text-align: center;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
        }
        .auth-links a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .auth-links a:hover {
            color: #2563eb;
            text-decoration: underline;
        }
        .error-message {
            background: #fef2f2;
            color: #b91c1c;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid #fecaca;
            font-size: 0.9rem;
        }
        .success-message {
            background: #f0fdf4;
            color: #166534;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid #bbf7d0;
            font-size: 0.9rem;
        }
        .helptext {
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }
        .field-error {
            color: #b91c1c;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            border-radius: 2px;
            background: #e5e7eb;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .strength-weak { background: #ef4444; width: 33%; }
        .strength-medium { background: #f59e0b; width: 66%; }
        .strength-strong { background: #10b981; width: 100%; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <h1>🏢 Freelancer CRM</h1>
            <p>Sukurk savo paskyrą</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">
                        {% if field.name == 'username' %}👤 Vartotojo vardas
                        {% elif field.name == 'email' %}📧 El. paštas
                        {% elif field.name == 'password1' %}🔒 Slaptažodis
                        {% elif field.name == 'password2' %}🔁 Patvirtink slaptažodį
                        {% else %}{{ field.label }}
                        {% endif %}
                    </label>
                    {{ field }}
                    {% if field.help_text %}<div class="helptext">{{ field.help_text }}</div>{% endif %}
                    {% if field.errors %}
                        {% for error in field.errors %}
                            <div class="field-error">{{ error }}</div>
                        {% endfor %}
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn">Sukurti paskyrą</button>
        </form>
        
        <div class="auth-links">
            <p>Jau turite paskyrą? <a href="/">Prisijungti</a></p>
        </div>
    </div>

    <script>
        // Password strength indicator
        document.addEventListener('DOMContentLoaded', function() {
            const password1 = document.querySelector('input[name="password1"]');
            if (password1) {
                password1.addEventListener('input', function() {
                    const password = this.value;
                    let strength = 0;
                    
                    if (password.length >= 8) strength++;
                    if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
                    if (password.match(/[0-9]/)) strength++;
                    if (password.match(/[^a-zA-Z0-9]/)) strength++;
                    
                    // Remove existing strength indicator if any
                    const existingIndicator = this.parentNode.querySelector('.password-strength');
                    if (existingIndicator) {
                        existingIndicator.remove();
                    }
                    
                    // Add new strength indicator
                    if (password.length > 0) {
                        const strengthDiv = document.createElement('div');
                        strengthDiv.className = 'password-strength';
                        
                        const strengthBar = document.createElement('div');
                        strengthBar.className = 'password-strength-bar';
                        
                        if (strength <= 1) strengthBar.classList.add('strength-weak');
                        else if (strength === 2) strengthBar.classList.add('strength-medium');
                        else strengthBar.classList.add('strength-strong');
                        
                        strengthDiv.appendChild(strengthBar);
                        this.parentNode.appendChild(strengthDiv);
                    }
                });
            }
        });
    </script>
</body>
</html>
