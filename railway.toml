# Applies to the "web" service by default (Railway uses this file's
# [build] section for every service built from this repo, but [deploy]
# settings like healthcheckPath only make sense for the one that serves
# HTTP traffic). The worker and beat services need their own Custom Start
# Command set in the Railway dashboard -- see RAILWAY.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
